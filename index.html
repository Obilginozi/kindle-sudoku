<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Sudoku</title>
<style>
  html, body { margin: 0; padding: 0; background: #fff; color: #000; }
  body { padding: 8px; font-family: sans-serif; }
  body.play { padding: 4px; }
  h1 { font-size: 26px; font-weight: bold; text-align: center; margin: 4px 0; }
  p { margin: 4px 0; }
  p.offline { font-weight: bold; font-size: 16px; text-align: center; margin: 2px 0 8px; }
  button, input.name {
    -webkit-appearance: none;
    appearance: none;
    display: block;
    width: 100%;
    min-height: 44px;
    margin: 8px 0;
    padding: 8px;
    font-size: 18px;
    font-family: sans-serif;
    background: #fff;
    color: #000;
    border: 2px solid #000;
    border-radius: 0;
  }
  button.on { background: #000; color: #fff; }
  .meta { text-align: center; font-size: 16px; }
  .about { display: block; font-size: 14px; font-weight: normal; }
  .err { min-height: 1.2em; font-size: 16px; }
  .block { border: 2px solid #000; padding: 8px; margin: 8px 0; }
  .bname { font-weight: bold; font-size: 18px; margin-bottom: 4px; }
  .wrap { max-width: 900px; margin: 0 auto; }
  body.play .wrap { max-width: none; }
  table.playroot { width: 100%; border-collapse: collapse; }
  td.mid { height: 100%; vertical-align: top; }
  table.head { width: 100%; border-collapse: collapse; margin: 0 0 4px; }
  table.head td { vertical-align: middle; padding: 0; }
  td.hspacer { width: 30%; }
  td.htitle { width: 40%; text-align: center; }
  td.hcredit { width: 30%; text-align: right; font-size: 14px; white-space: nowrap; }
  table.head h1 { text-align: center; font-size: 22px; margin: 0; }
  table.stage { width: 100%; border-collapse: collapse; }
  td.toolwrap { width: 120px; vertical-align: top; padding: 0 8px 0 0; }
  td.boardwrap { vertical-align: top; padding: 0; }
  table.board {
    width: 100%;
    margin: 0;
    border-collapse: collapse;
    table-layout: fixed;
    background: #fff;
  }
  table.board td.c {
    border: 1px solid #000;
    text-align: center;
    vertical-align: middle;
    padding: 0;
    font-weight: normal;
    background: #fff;
    color: #000;
  }
  table.board td.bl { border-left-width: 3px; }
  table.board td.br { border-right-width: 3px; }
  table.board td.bt { border-top-width: 3px; }
  table.board td.bb { border-bottom-width: 3px; }
  table.board td.given { font-weight: bold; }
  table.board td.sel { outline: 3px solid #000; }
  table.board td.bad { background: #000; color: #fff; }
  table.n { width: 100%; height: 100%; border-collapse: collapse; table-layout: fixed; }
  table.board table.n td {
    border: 0;
    outline: none;
    background: transparent;
    color: inherit;
    font-weight: normal;
    font-size: 8px;
    line-height: 1.1;
    padding: 0;
    height: auto;
  }
  table.tools { width: 120px; margin: 0; border-collapse: separate; border-spacing: 0; }
  table.tools td { padding: 0; }
  table.tools button {
    -webkit-box-sizing: border-box;

    margin: 4px 0 0;

  }
  #menu { margin-top: 0; }
  .sideinfo { margin: 22px 0 0; }
  .infobox {
    -webkit-box-sizing: border-box;
    box-sizing: border-box;
    border: 2px solid #000;
    margin: 10px 0 0;
    padding: 5px 4px;
    text-align: center;
    background: #fff;
  }
  .infobox .who { margin: 0; font-size: 14px; font-weight: bold; line-height: 1.25; word-wrap: break-word; }
  .infobox .lvl { margin: 2px 0 0; font-size: 12px; line-height: 1.25; word-wrap: break-word; }
  .infobox .stat { margin: 0; padding: 1px 0; font-size: 13px; line-height: 1.35; }
  .infobox .dot { margin: 0; padding: 0; font-size: 16px; line-height: 0.8; font-weight: bold; }
  table.digits { width: 100%; border-collapse: separate; border-spacing: 4px 0; margin: 0; }
  table.digits td { width: 11%; padding: 0; }
  table.digits button {
    -webkit-box-sizing: border-box;
    box-sizing: border-box;
    margin: 0;
    min-height: 0;
    padding: 0;
    font-size: 20px;
  }
  .hintbox { border: 0 solid #000; padding: 2px 4px; margin: 4px 0 0; font-size: 15px; }
  .egg { position: absolute; left: 0; top: 0; width: 100%; background: #fff; }
  .eggbox { border: 2px solid #000; margin: 72px auto 0; padding: 16px; width: 260px; text-align: center; background: #fff; }
  .eggbox p { font-size: 20px; font-weight: bold; margin: 0 0 12px; }
  .eggbox button { margin: 0; }
  #flash { display: none; background: #fff; height: 2400px; }
</style>

<body>
<div id="flash"></div>
<div id="app" class="wrap"></div>
<script>
/* Human Sudoku techniques, easiest first. ES5, no library.
   Ratings match the game bands:
   1 hidden single, 2 naked single,
   3 pointing, 4 claiming,
   5 naked pair, 6 hidden pair,
   7 naked triple, 8 hidden triple, 9 x-wing,
   10 swordfish, 11 xy-wing, 12 xyz-wing. */
var SudokuTech = (function () {
  'use strict';

  var ALL = 1022;
  var ROWS = [];
  var COLS = [];
  var BOXES = [];
  var UNITS = [];
  var PEERS = [];
  var SEE = [];

  function boxOf(i) {
    return (((i / 9) | 0) / 3 | 0) * 3 + (((i % 9) / 3) | 0);
  }

  function popcount(n) {
    var c = 0;
    while (n) {
      n &= n - 1;
      c++;
    }
    return c;
  }

  function digitOfMask(mask) {
    var d = 0;
    while (mask > 1) {
      mask >>= 1;
      d++;
    }
    return d;
  }

  function maskDigits(mask) {
    var ds = [];
    var d;
    for (d = 1; d <= 9; d++) {
      if (mask & (1 << d)) ds.push(d);
    }
    return ds;
  }

  function combinations(arr, k) {
    var out = [];
    var n = arr.length;
    function rec(start, combo) {
      var i;
      if (combo.length === k) {
        out.push(combo.slice());
        return;
      }
      for (i = start; i < n; i++) {
        combo.push(arr[i]);
        rec(i + 1, combo);
        combo.pop();
      }
    }
    rec(0, []);
    return out;
  }

  function unitMeta(u) {
    if (u < 9) return { house: 'row', houseIndex: u };
    if (u < 18) return { house: 'col', houseIndex: u - 9 };
    return { house: 'box', houseIndex: u - 18 };
  }

  (function buildMaps() {
    var r, c, b, i, j, k, list, seen, unit;
    for (r = 0; r < 9; r++) {
      list = [];
      for (c = 0; c < 9; c++) list.push(r * 9 + c);
      ROWS.push(list);
      UNITS.push(list);
    }
    for (c = 0; c < 9; c++) {
      list = [];
      for (r = 0; r < 9; r++) list.push(r * 9 + c);
      COLS.push(list);
      UNITS.push(list);
    }
    for (b = 0; b < 9; b++) {
      list = [];
      var br = ((b / 3) | 0) * 3;
      var bc = (b % 3) * 3;
      for (r = 0; r < 3; r++) {
        for (c = 0; c < 3; c++) list.push((br + r) * 9 + (bc + c));
      }
      BOXES.push(list);
      UNITS.push(list);
    }
    for (i = 0; i < 81; i++) {
      seen = {};
      list = [];
      unit = ROWS[(i / 9) | 0];
      for (k = 0; k < 9; k++) {
        j = unit[k];
        if (j !== i && !seen[j]) { seen[j] = 1; list.push(j); }
      }
      unit = COLS[i % 9];
      for (k = 0; k < 9; k++) {
        j = unit[k];
        if (j !== i && !seen[j]) { seen[j] = 1; list.push(j); }
      }
      unit = BOXES[boxOf(i)];
      for (k = 0; k < 9; k++) {
        j = unit[k];
        if (j !== i && !seen[j]) { seen[j] = 1; list.push(j); }
      }
      PEERS.push(list);
      SEE.push([]);
    }
    for (i = 0; i < 81; i++) {
      for (j = 0; j < 81; j++) SEE[i][j] = 0;
      list = PEERS[i];
      for (k = 0; k < list.length; k++) SEE[i][list[k]] = 1;
    }
  })();

  function initState(src) {
    var grid = [];
    var cands = [];
    var rows = [0, 0, 0, 0, 0, 0, 0, 0, 0];
    var cols = [0, 0, 0, 0, 0, 0, 0, 0, 0];
    var boxes = [0, 0, 0, 0, 0, 0, 0, 0, 0];
    var i, d, bit, r, c, b;
    for (i = 0; i < 81; i++) {
      d = src[i] | 0;
      if (d < 0 || d > 9) return null;
      grid.push(d);
      r = (i / 9) | 0;
      c = i % 9;
      b = boxOf(i);
      if (d) {
        bit = 1 << d;
        if ((rows[r] | cols[c] | boxes[b]) & bit) return null;
        rows[r] |= bit;
        cols[c] |= bit;
        boxes[b] |= bit;
      }
    }
    for (i = 0; i < 81; i++) {
      if (grid[i]) {
        cands.push(0);
      } else {
        r = (i / 9) | 0;
        c = i % 9;
        b = boxOf(i);
        cands.push(ALL & ~(rows[r] | cols[c] | boxes[b]));
        if (!cands[i]) return null;
      }
    }
    return { grid: grid, cands: cands };
  }

  function isSolved(grid) {
    var i;
    for (i = 0; i < 81; i++) if (!grid[i]) return false;
    return true;
  }

  function place(state, index, digit) {
    var bit = 1 << digit;
    var list = PEERS[index];
    var k, j;
    state.grid[index] = digit;
    state.cands[index] = 0;
    for (k = 0; k < list.length; k++) {
      j = list[k];
      if (state.grid[j]) continue;
      state.cands[j] &= ~bit;
      if (!state.cands[j]) return false;
    }
    return true;
  }

  function applyElim(state, elim) {
    var k, bit, i, changed;
    changed = false;
    for (k = 0; k < elim.length; k++) {
      i = elim[k].index;
      if (state.grid[i]) continue;
      bit = 1 << elim[k].digit;
      if (state.cands[i] & bit) {
        state.cands[i] &= ~bit;
        changed = true;
        if (!state.cands[i]) return false;
      }
    }
    return changed;
  }

  function findHiddenSingle(state) {
    var u, k, d, bit, count, found, unit, meta, i;
    for (u = 0; u < 27; u++) {
      unit = UNITS[u];
      for (d = 1; d <= 9; d++) {
        bit = 1 << d;
        count = 0;
        found = -1;
        for (k = 0; k < 9; k++) {
          i = unit[k];
          if (state.grid[i] === d) { count = 0; break; }
          if (!state.grid[i] && (state.cands[i] & bit)) {
            count++;
            found = i;
            if (count > 1) break;
          }
        }
        if (count === 1) {
          meta = unitMeta(u);
          return {
            tech: 1,
            place: { index: found, digit: d },
            digit: d,
            house: meta.house,
            houseIndex: meta.houseIndex
          };
        }
      }
    }
    return null;
  }

  function findNakedSingle(state) {
    var i, m, d;
    for (i = 0; i < 81; i++) {
      if (state.grid[i]) continue;
      m = state.cands[i];
      if (m && (m & (m - 1)) === 0) {
        d = digitOfMask(m);
        return { tech: 2, place: { index: i, digit: d }, digit: d, index: i };
      }
    }
    return null;
  }

  function findPointing(state) {
    var b, d, bit, k, i, n, rowBits, colBits, elim, row, col, c, r;
    for (b = 0; b < 9; b++) {
      for (d = 1; d <= 9; d++) {
        bit = 1 << d;
        n = 0;
        rowBits = 0;
        colBits = 0;
        for (k = 0; k < 9; k++) {
          i = BOXES[b][k];
          if (!state.grid[i] && (state.cands[i] & bit)) {
            n++;
            rowBits |= 1 << ((i / 9) | 0);
            colBits |= 1 << (i % 9);
          }
        }
        if (n < 2) continue;
        elim = [];
        if ((rowBits & (rowBits - 1)) === 0) {
          row = digitOfMask(rowBits);
          for (c = 0; c < 9; c++) {
            i = row * 9 + c;
            if (boxOf(i) !== b && !state.grid[i] && (state.cands[i] & bit)) {
              elim.push({ index: i, digit: d });
            }
          }
        } else if ((colBits & (colBits - 1)) === 0) {
          col = digitOfMask(colBits);
          for (r = 0; r < 9; r++) {
            i = r * 9 + col;
            if (boxOf(i) !== b && !state.grid[i] && (state.cands[i] & bit)) {
              elim.push({ index: i, digit: d });
            }
          }
        }
        if (elim.length) {
          return { tech: 3, elim: elim, digit: d, house: 'box', houseIndex: b };
        }
      }
    }
    return null;
  }

  function findClaiming(state) {
    var r, c, d, bit, n, boxBits, b, elim, k, i, line;
    for (r = 0; r < 9; r++) {
      for (d = 1; d <= 9; d++) {
        bit = 1 << d;
        n = 0;
        boxBits = 0;
        for (c = 0; c < 9; c++) {
          i = r * 9 + c;
          if (!state.grid[i] && (state.cands[i] & bit)) {
            n++;
            boxBits |= 1 << boxOf(i);
          }
        }
        if (n >= 2 && (boxBits & (boxBits - 1)) === 0) {
          b = digitOfMask(boxBits);
          elim = [];
          for (k = 0; k < 9; k++) {
            i = BOXES[b][k];
            if (((i / 9) | 0) !== r && !state.grid[i] && (state.cands[i] & bit)) {
              elim.push({ index: i, digit: d });
            }
          }
          if (elim.length) {
            return { tech: 4, elim: elim, digit: d, house: 'row', houseIndex: r };
          }
        }
      }
    }
    for (c = 0; c < 9; c++) {
      for (d = 1; d <= 9; d++) {
        bit = 1 << d;
        n = 0;
        boxBits = 0;
        for (r = 0; r < 9; r++) {
          i = r * 9 + c;
          if (!state.grid[i] && (state.cands[i] & bit)) {
            n++;
            boxBits |= 1 << boxOf(i);
          }
        }
        if (n >= 2 && (boxBits & (boxBits - 1)) === 0) {
          b = digitOfMask(boxBits);
          elim = [];
          for (k = 0; k < 9; k++) {
            i = BOXES[b][k];
            if ((i % 9) !== c && !state.grid[i] && (state.cands[i] & bit)) {
              elim.push({ index: i, digit: d });
            }
          }
          if (elim.length) {
            return { tech: 4, elim: elim, digit: d, house: 'col', houseIndex: c };
          }
        }
      }
    }
    line = null;
    return line;
  }

  function findNakedSubset(state, size, tech) {
    var u, k, i, pc, idxs, combos, ci, combo, union, elim, j, inCombo, bits, d, meta;
    for (u = 0; u < 27; u++) {
      idxs = [];
      for (k = 0; k < 9; k++) {
        i = UNITS[u][k];
        if (state.grid[i]) continue;
        pc = popcount(state.cands[i]);
        if (pc >= 2 && pc <= size) idxs.push(i);
      }
      if (idxs.length < size) continue;
      combos = combinations(idxs, size);
      for (ci = 0; ci < combos.length; ci++) {
        combo = combos[ci];
        union = 0;
        for (j = 0; j < combo.length; j++) union |= state.cands[combo[j]];
        if (popcount(union) !== size) continue;
        elim = [];
        for (k = 0; k < 9; k++) {
          i = UNITS[u][k];
          if (state.grid[i]) continue;
          inCombo = false;
          for (j = 0; j < combo.length; j++) if (combo[j] === i) inCombo = true;
          if (inCombo) continue;
          bits = state.cands[i] & union;
          if (!bits) continue;
          for (d = 1; d <= 9; d++) {
            if (bits & (1 << d)) elim.push({ index: i, digit: d });
          }
        }
        if (elim.length) {
          meta = unitMeta(u);
          return {
            tech: tech,
            elim: elim,
            digits: maskDigits(union),
            house: meta.house,
            houseIndex: meta.houseIndex
          };
        }
      }
    }
    return null;
  }

  function findHiddenSubset(state, size, tech) {
    var u, d, k, i, digitList, combos, ci, combo, positions, seen, p, elim, bits, dd, meta, cell;
    for (u = 0; u < 27; u++) {
      digitList = [];
      var where = [];
      for (d = 1; d <= 9; d++) {
        positions = [];
        for (k = 0; k < 9; k++) {
          i = UNITS[u][k];
          if (!state.grid[i] && (state.cands[i] & (1 << d))) positions.push(i);
        }
        where[d] = positions;
        if (positions.length >= 1 && positions.length <= size) digitList.push(d);
      }
      if (digitList.length < size) continue;
      combos = combinations(digitList, size);
      for (ci = 0; ci < combos.length; ci++) {
        combo = combos[ci];
        seen = {};
        positions = [];
        for (p = 0; p < combo.length; p++) {
          var cells = where[combo[p]];
          for (k = 0; k < cells.length; k++) {
            cell = cells[k];
            if (!seen[cell]) {
              seen[cell] = 1;
              positions.push(cell);
              if (positions.length > size) break;
            }
          }
          if (positions.length > size) break;
        }
        if (positions.length !== size) continue;
        elim = [];
        bits = 0;
        for (p = 0; p < combo.length; p++) bits |= 1 << combo[p];
        for (k = 0; k < positions.length; k++) {
          i = positions[k];
          for (dd = 1; dd <= 9; dd++) {
            if ((state.cands[i] & (1 << dd)) && !(bits & (1 << dd))) {
              elim.push({ index: i, digit: dd });
            }
          }
        }
        if (elim.length) {
          meta = unitMeta(u);
          return {
            tech: tech,
            elim: elim,
            digits: combo.slice(),
            house: meta.house,
            houseIndex: meta.houseIndex
          };
        }
      }
    }
    return null;
  }

  function findFish(state, size, tech) {
    var d, bit, r, c, i, cols, rows, bases, combos, ci, combo, unionMap, union, e, elim, rr, cc, inBase;
    for (d = 1; d <= 9; d++) {
      bit = 1 << d;
      bases = [];
      for (r = 0; r < 9; r++) {
        cols = [];
        for (c = 0; c < 9; c++) {
          i = r * 9 + c;
          if (!state.grid[i] && (state.cands[i] & bit)) cols.push(c);
        }
        if (cols.length >= 2 && cols.length <= size) bases.push({ line: r, cover: cols });
      }
      if (bases.length >= size) {
        combos = combinations(bases, size);
        for (ci = 0; ci < combos.length; ci++) {
          combo = combos[ci];
          unionMap = {};
          union = [];
          for (e = 0; e < combo.length; e++) {
            for (c = 0; c < combo[e].cover.length; c++) {
              cc = combo[e].cover[c];
              if (!unionMap[cc]) { unionMap[cc] = 1; union.push(cc); }
            }
          }
          if (union.length !== size) continue;
          elim = [];
          for (rr = 0; rr < 9; rr++) {
            inBase = false;
            for (e = 0; e < combo.length; e++) if (combo[e].line === rr) inBase = true;
            if (inBase) continue;
            for (c = 0; c < union.length; c++) {
              i = rr * 9 + union[c];
              if (!state.grid[i] && (state.cands[i] & bit)) elim.push({ index: i, digit: d });
            }
          }
          if (elim.length) return { tech: tech, elim: elim, digit: d, house: 'row' };
        }
      }
      bases = [];
      for (c = 0; c < 9; c++) {
        rows = [];
        for (r = 0; r < 9; r++) {
          i = r * 9 + c;
          if (!state.grid[i] && (state.cands[i] & bit)) rows.push(r);
        }
        if (rows.length >= 2 && rows.length <= size) bases.push({ line: c, cover: rows });
      }
      if (bases.length >= size) {
        combos = combinations(bases, size);
        for (ci = 0; ci < combos.length; ci++) {
          combo = combos[ci];
          unionMap = {};
          union = [];
          for (e = 0; e < combo.length; e++) {
            for (r = 0; r < combo[e].cover.length; r++) {
              rr = combo[e].cover[r];
              if (!unionMap[rr]) { unionMap[rr] = 1; union.push(rr); }
            }
          }
          if (union.length !== size) continue;
          elim = [];
          for (cc = 0; cc < 9; cc++) {
            inBase = false;
            for (e = 0; e < combo.length; e++) if (combo[e].line === cc) inBase = true;
            if (inBase) continue;
            for (r = 0; r < union.length; r++) {
              i = union[r] * 9 + cc;
              if (!state.grid[i] && (state.cands[i] & bit)) elim.push({ index: i, digit: d });
            }
          }
          if (elim.length) return { tech: tech, elim: elim, digit: d, house: 'col' };
        }
      }
    }
    return null;
  }

  function findXYWing(state) {
    var bi = [];
    var i, p, a, b, xy, xz, yz, z, zd, elim, t;
    for (i = 0; i < 81; i++) {
      if (!state.grid[i] && popcount(state.cands[i]) === 2) bi.push(i);
    }
    for (p = 0; p < bi.length; p++) {
      xy = state.cands[bi[p]];
      for (a = 0; a < PEERS[bi[p]].length; a++) {
        i = PEERS[bi[p]][a];
        if (state.grid[i] || popcount(state.cands[i]) !== 2) continue;
        xz = state.cands[i];
        if (popcount(xy & xz) !== 1 || popcount(xy | xz) !== 3) continue;
        for (b = a + 1; b < PEERS[bi[p]].length; b++) {
          t = PEERS[bi[p]][b];
          if (state.grid[t] || popcount(state.cands[t]) !== 2) continue;
          yz = state.cands[t];

  function contains(arr, value) {
    var i;
    for (i = 0; i < arr.length; i++) if (arr[i] === value) return true;
    return false;
  }

  function startLevel(id) {
    var player = findPlayer(state.lastPlayer);
    var list = PUZZLES[id];
    var seen, avail, i, index, item, values, givens, notes, solution, n;
    if (!player || !list || !list.length) return;
    seen = player.stats[id].seen;
    avail = [];
    for (i = 0; i < list.length; i++) {
      if (contains(seen, i)) continue;
      if (player.current && player.current.level === id && player.current.index === i) continue;
      avail.push(i);
    }
    if (!avail.length) {
      player.stats[id].seen = [];
      for (i = 0; i < list.length; i++) avail.push(i);
    }
    index = avail[(Math.random() * avail.length) | 0];
    item = list[index];
    values = [];
    givens = [];
    notes = [];
    solution = [];
    for (i = 0; i < 81; i++) {
      n = item.g.charCodeAt(i) - 48;
      values.push(n);
      givens.push(n ? 1 : 0);
      notes.push(0);
      solution.push(item.s.charCodeAt(i) - 48);
    }
    player.current = {
      level: id,
      index: index,
      values: values,
      givens: givens,
      notes: notes,
      solution: solution,
      mistakes: 0,
      hintsUsed: 0,
      elapsedMs: 0,
      undo: [],
      selected: -1,
      lastEdit: -1,
      notesMode: 0
    };
    sessionStart = 0;
    save();
    showGame();
  }

  function conflicts(i) {
    var g = cur();
    var v = g.values[i];
    var r, c, k, j, br, bc, rr, cc;
    if (!v) return false;
    r = (i / 9) | 0;
    c = i % 9;
    for (k = 0; k < 9; k++) {
      j = r * 9 + k;
      if (j !== i && g.values[j] === v) return true;
      j = k * 9 + c;
      if (j !== i && g.values[j] === v) return true;
    }
    br = ((r / 3) | 0) * 3;
    bc = ((c / 3) | 0) * 3;
    for (rr = 0; rr < 3; rr++) {
      for (cc = 0; cc < 3; cc++) {
        j = (br + rr) * 9 + (bc + cc);
        if (j !== i && g.values[j] === v) return true;
      }
    }
    return false;
  }

  function classFor(i) {
    var g = cur();
    var r = (i / 9) | 0;
    var c = i % 9;
    var cls = 'c';
    if (c === 0) cls += ' bl';
    if (r === 0) cls += ' bt';
    if (c === 2 || c === 5 || c === 8) cls += ' br';
    if (r === 2 || r === 5 || r === 8) cls += ' bb';
    if (g.givens[i]) cls += ' given';
    if (i === g.selected) cls += ' sel';
    if (state.checkConflicts && i === g.lastEdit && g.values[i] && conflicts(i)) cls += ' bad';
    return cls;
  }

  function notesHtml(mask) {
    var html = '<table class="n" style="font-size:' + notePx + 'px"><tbody>';
    var d = 1;
    var r, c;
    for (r = 0; r < 3; r++) {
      html += '<tr>';
      for (c = 0; c < 3; c++) {
        html += '<td>' + ((mask & (1 << d)) ? String(d) : '') + '</td>';
        d++;
      }
      html += '</tr>';
    }
    return html + '</tbody></table>';
  }

  function renderCell(i) {
    var g = cur();
    var td = boardCells[i];
    if (!td || !g) return;
    td.className = classFor(i);
    if (g.values[i]) td.innerHTML = String(g.values[i]);
    else if (g.notes[i]) td.innerHTML = notesHtml(g.notes[i]);
    else td.innerHTML = '';
  }

  function renderAll() {
    var i;
    for (i = 0; i < 81; i++) renderCell(i);
  }

  function viewportH() {
    return window.innerHeight || document.documentElement.clientHeight || 0;
  }

  function applySize(h) {
    var table = byId('board');
    var wrap = byId('boardwrap');
    var i, px;
    px = h * 9;
    if (wrap) wrap.style.width = (px + 2) + 'px';
    if (table) {
      table.style.width = px + 'px';
      table.style.height = px + 'px';
    }
    notePx = (h / 5) | 0;
    if (notePx < 7) notePx = 7;
    if (notePx > 16) notePx = 16;
    for (i = 0; i < boardCells.length; i++) {
      boardCells[i].style.height = h + 'px';
      boardCells[i].style.fontSize = ((h * 0.52) | 0) + 'px';
    }
    renderAll();
  }

  function sizeDigits() {
    var digits = byId('digits');
    var buttons, dw, i, fs;
    if (!digits) return 0;
    buttons = digits.getElementsByTagName('button');
    if (!buttons.length) return digits.offsetHeight;
    dw = buttons[0].offsetWidth;
    if (dw < 26) dw = 26;
    fs = (dw * 0.52) | 0;
    if (fs < 14) fs = 14;
    if (fs > 32) fs = 32;
    for (i = 0; i < buttons.length; i++) {
      buttons[i].style.height = dw + 'px';
      buttons[i].style.fontSize = fs + 'px';
    }
    return digits.offsetHeight;
  }

  function sizeBoard() {
    var table = byId('board');
    var root = byId('playroot');
    var tools = byId('tools');
    var head = byId('ghead');
    var foot = byId('gfoot');
    var toolW, stageW, boardMax, cellW, vh, rootH, headH, footH, room, h, docH, extra, shrink;
    if (!table || !boardCells.length) return;
    vh = viewportH();
    rootH = vh - 8;
    if (rootH < 240) rootH = 240;
    if (root) root.style.height = rootH + 'px';
    toolW = 120;
    if (tools) {
      tools.style.width = toolW + 'px';
      if (tools.parentNode && tools.parentNode.style) tools.parentNode.style.width = toolW + 'px';
    }
    sizeDigits();
    stageW = root ? root.clientWidth : 0;
    if (!stageW) {
      renderAll();
      return;
    }
    boardMax = stageW - toolW - 8;
    if (boardMax < 180) boardMax = 180;
    cellW = (boardMax / 9) | 0;
    headH = head ? head.offsetHeight : 32;
    footH = foot ? foot.offsetHeight : 48;
    room = rootH - headH - footH - 4;
    if (room < 180) room = 180;
    h = (room / 9) | 0;
    if (cellW < h) h = cellW;
    if (h < 22) h = 22;
    applySize(h);
    docH = document.body.scrollHeight || document.documentElement.scrollHeight;
    if (vh && docH > vh + 2 && h > 22) {
      extra = docH - vh;
      shrink = ((extra / 9) | 0) + 1;
      h = h - shrink;
      if (h < 22) h = 22;
      applySize(h);
    }
    alignTools();
  }

  function alignTools() {
    var board = byId('board');
    var first = byId('menu');
    var tools = byId('tools');
    var delta;
    if (!board || !first || !tools || !board.getBoundingClientRect) return;
    tools.style.marginTop = '0px';
    delta = board.getBoundingClientRect().top - first.getBoundingClientRect().top;
    delta = Math.round(delta);
    if (delta) tools.style.marginTop = delta + 'px';
  }

  function fold() {
    var g = cur();
    if (!g || !sessionStart) return;
    g.elapsedMs += Date.now() - sessionStart;
    sessionStart = Date.now();
  }

  function liveMs() {
    var g = cur();
    if (!g) return 0;
    if (!sessionStart) return g.elapsedMs;
    return g.elapsedMs + (Date.now() - sessionStart);
  }

  function updateHud() {
    var g = cur();
    var info, player;
    if (!g || !byId('time')) return;
    info = levelInfo(g.level);
    player = findPlayer(state.lastPlayer);
    if (byId('pname')) byId('pname').textContent = player ? player.name : '';
    if (byId('plevel')) byId('plevel').textContent = info ? info.name : '';

    byId('miss').textContent = L().mistakes + ' ' + g.mistakes;
    byId('used').textContent = L().hints + ' ' + g.hintsUsed;
  }

  function paintNotes() {
    var g = cur();
    var b = byId('notes');
    if (!b || !g) return;
    b.className = g.notesMode ? 'on' : '';
    b.textContent = g.notesMode ? L().notesOn : L().notes;
  }

  function setHintBox(text) {
    var box = byId('hintbox');
    var had, next;
    if (!box) return;
    had = box.textContent ? 1 : 0;
    next = text ? 1 : 0;
    box.textContent = text || '';
    box.style.borderWidth = text ? '2px' : '0';
    if (view === 'game' && had !== next) sizeBoard();
  }

  function houseLabel(house, index) {
    var n = (index || 0) + 1;
    if (state.lang === 'en') {
      if (house === 'row') return 'row ' + n;
      if (house === 'col') return 'column ' + n;
      return 'box ' + n;
    }
    if (house === 'row') return n + '. satır';
    if (house === 'col') return n + '. sütun';
    return n + '. kutu';
  }

  function cellLabel(index) {
    var r = ((index / 9) | 0) + 1;
    var c = (index % 9) + 1;
    if (state.lang === 'en') return 'row ' + r + ', column ' + c;
    return r + '. satır, ' + c + '. sütun';
  }

  function hintText(hint) {
    var cell = cellLabel(hint.index);
    var d = String(hint.digit);
    var info = hint.info || {};
    var pd = String(info.digit || hint.digit);
    var digits = info.digits && info.digits.length ? info.digits.join(', ') : pd;
    var house = info.house ? houseLabel(info.house, info.houseIndex) : '';
    var tech = hint.tech;
    if (state.lang === 'en') {
      if (tech === 1 && house) return 'Hidden single: in ' + house + ', ' + d + ' fits only ' + cell + '.';
      if (tech === 2) return 'Naked single: ' + cell + ' has only ' + d + ' left.';
      if (tech === 3) return 'Pointing: ' + pd + ' is locked to one line in a box. Result: ' + cell + ' = ' + d + '.';
      if (tech === 4) return 'Box-line reduction: ' + pd + ' in a line sits in one box. Result: ' + cell + ' = ' + d + '.';
      if (tech === 5) return 'Naked pair (' + digits + ') locks two cells. Result: ' + cell + ' = ' + d + '.';
      if (tech === 6) return 'Hidden pair (' + digits + ') lives in only two cells. Result: ' + cell + ' = ' + d + '.';
      if (tech === 7) return 'Naked triple (' + digits + ') locks three cells. Result: ' + cell + ' = ' + d + '.';
      if (tech === 8) return 'Hidden triple (' + digits + ') lives in only three cells. Result: ' + cell + ' = ' + d + '.';
      if (tech === 9) return 'X-Wing: ' + pd + ' occupies the same two lines. Result: ' + cell + ' = ' + d + '.';
      if (tech === 10) return 'Swordfish: ' + pd + ' is locked across three lines. Result: ' + cell + ' = ' + d + '.';
      if (tech === 11) return 'XY-Wing: the wings remove ' + pd + '. Result: ' + cell + ' = ' + d + '.';
      if (tech === 12) return 'XYZ-Wing: the shared candidate ' + pd + ' is removed. Result: ' + cell + ' = ' + d + '.';
      return 'Next digit: ' + cell + ' = ' + d + '.';
    }
    if (tech === 1 && house) return 'Gizli tek: ' + house + ' içinde ' + d + ' yalnız ' + cell + ' hücresine yazılır.';
    if (tech === 2) return 'Çıplak tek: ' + cell + ' hücresinde geriye yalnız ' + d + ' kaldı.';
    if (tech === 3) return 'İşaretleme: ' + pd + ' bir kutuda tek çizgiye kilitli. Sonuç: ' + cell + ' = ' + d + '.';
    if (tech === 4) return 'Satır-kutu elemesi: ' + pd + ' adayları tek kutuda toplanıyor. Sonuç: ' + cell + ' = ' + d + '.';
    if (tech === 5) return 'Çıplak çift (' + digits + ') iki hücreyi kilitler. Sonuç: ' + cell + ' = ' + d + '.';
    if (tech === 6) return 'Gizli çift (' + digits + ') yalnız iki hücrede duruyor. Sonuç: ' + cell + ' = ' + d + '.';
    if (tech === 7) return 'Çıplak üçlü (' + digits + ') üç hücreyi kilitler. Sonuç: ' + cell + ' = ' + d + '.';
    if (tech === 8) return 'Gizli üçlü (' + digits + ') yalnız üç hücrede. Sonuç: ' + cell + ' = ' + d + '.';
    if (tech === 9) return 'X-Wing: ' + pd + ' iki çizgide aynı konuma oturur. Sonuç: ' + cell + ' = ' + d + '.';
    if (tech === 10) return 'Swordfish: ' + pd + ' üç çizgide kilitlenir. Sonuç: ' + cell + ' = ' + d + '.';
    if (tech === 11) return 'XY-Wing: kanatlar ' + pd + ' adayını eler. Sonuç: ' + cell + ' = ' + d + '.';
    if (tech === 12) return 'XYZ-Wing: ortak aday ' + pd + ' elenir. Sonuç: ' + cell + ' = ' + d + '.';
    return 'Sonraki rakam: ' + cell + ' = ' + d + '.';
  }

  function paintTouched(a, b, c, d) {
    var seen = {};
    var list = [a, b, c, d];
    var i;
    for (i = 0; i < list.length; i++) {
      if (list[i] === null || list[i] === undefined || list[i] < 0 || seen[list[i]]) continue;
      seen[list[i]] = 1;
      renderCell(list[i]);
    }
  }

  function pushUndo(index) {
    var g = cur();
    g.undo.push({
      i: index,
      value: g.values[index],
      notes: g.notes[index],
      mistakes: g.mistakes,
      lastEdit: g.lastEdit,
      selected: g.selected
    });
    if (g.undo.length > 80) g.undo.shift();
  }

  function select(index) {
    var g = cur();
    var prev;
    if (!g || index < 0 || index > 80) return;
    prev = g.selected;
    g.selected = index;
    paintTouched(prev, index);
  }

  function placeDigit(d) {
    var g = cur();
    var prevLast, i;
    if (!g || g.selected < 0 || g.givens[g.selected]) return;
    if (d < 1 || d > 9) return;
    fold();
    i = g.selected;
    prevLast = g.lastEdit;
    pushUndo(i);
    if (g.notesMode && !g.values[i]) {
      g.notes[i] ^= (1 << d);
    } else {
      g.values[i] = d;
      g.notes[i] = 0;
      g.lastEdit = i;
      if (conflicts(i)) g.mistakes++;
    }
    setHintBox('');
    paintTouched(prevLast, i);
    updateHud();
    save();
    if (isWin()) finish();
  }

  function erase() {
    var g = cur();
    var i, prevLast;
    if (!g || g.selected < 0 || g.givens[g.selected]) return;
    i = g.selected;
    if (!g.values[i] && !g.notes[i]) return;
    fold();
    prevLast = g.lastEdit;
    pushUndo(i);
    g.values[i] = 0;
    g.notes[i] = 0;
    g.lastEdit = i;
    setHintBox('');
    paintTouched(prevLast, i);
    updateHud();
    save();
  }

  function undo() {
    var g = cur();
    var step, oldSel, oldLast;
    if (!g || !g.undo.length) return;
    fold();
    oldSel = g.selected;
    oldLast = g.lastEdit;
    step = g.undo.pop();
    g.values[step.i] = step.value;
    g.notes[step.i] = step.notes;
    g.mistakes = step.mistakes;
    g.lastEdit = step.lastEdit;
    g.selected = step.selected;
    setHintBox('');
    paintTouched(step.i, oldSel, oldLast, g.lastEdit);
    if (g.selected !== step.i && g.selected !== oldSel && g.selected !== oldLast && g.selected !== g.lastEdit) {
      renderCell(g.selected);
    }
    updateHud();
    save();
  }

  function useHint() {
    var g = cur();
    var grid = [];
    var i, hint, oldSel, oldLast;
    if (!g) return;
    for (i = 0; i < 81; i++) grid.push(g.values[i] === g.solution[i] ? g.solution[i] : 0);
    hint = SudokuTech.nextHint(grid);
    fold();
    if (!hint) {
      setHintBox(L().noHint);
      updateHud();
      return;
    }
    oldSel = g.selected;
    oldLast = g.lastEdit;
    pushUndo(hint.index);
    g.values[hint.index] = hint.digit;
    g.notes[hint.index] = 0;
    g.hintsUsed++;
    g.lastEdit = hint.index;
    g.selected = hint.index;
    setHintBox(hintText(hint));
    paintTouched(hint.index, oldSel, oldLast);
    updateHud();
    save();
    if (isWin()) finish();
  }

  function isWin() {
    var g = cur();
    var i;
    if (!g) return false;
    for (i = 0; i < 81; i++) if (g.values[i] !== g.solution[i]) return false;
    return true;
  }

  function finish() {
    var player = findPlayer(state.lastPlayer);
    var g = player.current;
    var st = player.stats[g.level];
    fold();
    st.completed += 1;
    st.mistakes += g.mistakes;
    st.hints += g.hintsUsed;
    if (!st.bestMs || g.elapsedMs < st.bestMs) st.bestMs = g.elapsedMs;
    if (!contains(st.seen, g.index)) st.seen.push(g.index);
    lastResult = { level: g.level, ms: g.elapsedMs, mistakes: g.mistakes, hints: g.hintsUsed };
    player.current = null;
    sessionStart = 0;
    save();
    showDone();
  }

  function onBoard(e) {
    var t = e.target || e.srcElement;
    var raw;
    while (t && t !== byId('board')) {
      if (t.getAttribute && t.getAttribute('data-i') !== null) {
        raw = t.getAttribute('data-i');
        select(parseInt(raw, 10));
        return;
      }
      t = t.parentNode;
    }
  }

  function showGame() {
    var g = cur();
    var lang, table, tbody, r, c, i, tr, td, html, creditClicks;
    if (!g) {
      showHome();
      return;
    }
    view = 'game';
    sessionStart = Date.now();
    lang = L();
    html = '<table class="playroot" id="playroot"><tbody>';
    html += '<tr><td id="ghead"><table class="head"><tbody><tr>';
    html += '<td class="hspacer"></td>';
    html += '<td class="htitle"><h1>' + lang.title + '</h1></td>';
    html += '<td class="hcredit"><span id="credit">By Obilginozi</span></td>';
    html += '</tr></tbody></table></td></tr>';
    html += '<tr><td class="mid"><table class="stage"><tbody><tr>';
    html += '<td class="toolwrap"><table class="tools" id="tools"><tbody>';
    html += '<tr><td><button type="button" id="menu"></button></td></tr>';
    html += '<tr><td><button type="button" id="flashBtn"></button></td></tr>';
    html += '<tr><td><button type="button" id="notes"></button></td></tr>';
    html += '<tr><td><button type="button" id="hint"></button></td></tr>';
    html += '<tr><td><button type="button" id="erase"></button></td></tr>';
    html += '<tr><td><button type="button" id="undo"></button></td></tr>';
    html += '</tbody></table>';
    html += '<div class="sideinfo">';
    html += '<div class="infobox">';
    html += '<div id="pname" class="who"></div>';
    html += '<div id="plevel" class="lvl"></div>';
    html += '</div>';
    html += '<div class="infobox">';
    html += '<div id="time" class="stat"></div>';
    html += '<div class="dot">.</div>';
    html += '<div id="miss" class="stat"></div>';
    html += '<div class="dot">.</div>';
    html += '<div id="used" class="stat"></div>';
    html += '</div></div></td>';
    html += '<td id="boardwrap" class="boardwrap"><table id="board" class="board"></table></td>';
    html += '</tr></tbody></table></td></tr>';
    html += '<tr><td id="gfoot">';
    html += '<table class="digits" id="digits"><tbody><tr>';
    html += '<td><button type="button" data-d="1">1</button></td>';
    html += '<td><button type="button" data-d="2">2</button></td>';
    html += '<td><button type="button" data-d="3">3</button></td>';
    html += '<td><button type="button" data-d="4">4</button></td>';
    html += '<td><button type="button" data-d="5">5</button></td>';
    html += '<td><button type="button" data-d="6">6</button></td>';
    html += '<td><button type="button" data-d="7">7</button></td>';
    html += '<td><button type="button" data-d="8">8</button></td>';
    html += '<td><button type="button" data-d="9">9</button></td>';
    html += '</tr></tbody></table>';
    html += '<p id="hintbox" class="hintbox"></p>';
    html += '</td></tr></tbody></table>';
    html += '<div id="egg" class="egg" style="display:none"><div class="eggbox"><p>Aşk ile yapıldı.</p><button type="button" id="eggok">Tamam</button></div></div>';
    setApp(html);
    byId('erase').textContent = lang.erase;
    byId('undo').textContent = lang.undo;
    byId('hint').textContent = lang.hint;
    byId('menu').textContent = lang.menu;
    byId('flashBtn').textContent = lang.refreshShort;
    table = byId('board');
    tbody = document.createElement('tbody');
    boardCells = [];
    i = 0;
    for (r = 0; r < 9; r++) {
      tr = document.createElement('tr');
      for (c = 0; c < 9; c++) {
        td = document.createElement('td');
        td.setAttribute('data-i', String(i));
        tr.appendChild(td);
        boardCells.push(td);
        i++;
      }
      tbody.appendChild(tr);
    }
    table.appendChild(tbody);
    table.onclick = onBoard;
    var padButtons = document.getElementById('app').getElementsByTagName('button');
    for (i = 0; i < padButtons.length; i++) {
      if (padButtons[i].getAttribute('data-d')) {
        padButtons[i].onclick = function (ev) {
          var t = ev.target || ev.srcElement;
          placeDigit(parseInt(t.getAttribute('data-d'), 10));
        };
      }
    }
    byId('notes').onclick = function () {
      var game = cur();
      if (!game) return;
      game.notesMode = game.notesMode ? 0 : 1;
      paintNotes();
      save();
    };
    byId('erase').onclick = erase;
    byId('undo').onclick = undo;
    byId('hint').onclick = useHint;
    byId('menu').onclick = function () {
      fold();
      sessionStart = 0;
      save();
      showHome();
    };
    byId('flashBtn').onclick = flash;
    creditClicks = 0;
    byId('credit').onclick = function () {
      creditClicks += 1;
      if (creditClicks < 3) return;
      creditClicks = 0;
      byId('egg').style.height = viewportH() + 'px';
      byId('egg').style.display = 'block';
    };
    byId('eggok').onclick = function () {
      byId('egg').style.display = 'none';
    };
    paintNotes();
    updateHud();
    sizeBoard();
  }

  function showDone() {
    var lang = L();
    var info, html;
    view = 'done';
    info = lastResult ? levelInfo(lastResult.level) : null;
    html = '<h1>' + lang.done + '</h1>';
    if (info) html += '<p class="meta">' + esc(info.name) + '</p>';
    if (lastResult) {
      html += '<div class="block">';
      html += '<div>' + formatMs(lastResult.ms) + '</div>';
      html += '<div>' + lang.mistakes + ' ' + lastResult.mistakes + '</div>';
      html += '<div>' + lang.hints + ' ' + lastResult.hints + '</div>';
      html += '</div>';
    }
    html += '<button type="button" id="again">' + lang.again + '</button>';
    html += '<button type="button" id="home">' + lang.home + '</button>';
    setApp(html);
    byId('again').onclick = function () { purpose = 'play'; showPlayers(); };
    byId('home').onclick = showHome;
  }

  function showStats() {
    var lang = L();
    var player = findPlayer(state.lastPlayer);
    var html = '';
    var i, info, st;
    view = 'stats';
    if (!player) {
      purpose = 'stats';
      showPlayers();
      return;
    }
    html += '<h1>' + esc(player.name) + '</h1>';
    for (i = 0; i < lang.levels.length; i++) {
      info = lang.levels[i];
      st = player.stats[info.id];
      html += '<div class="block">';
      html += '<div class="bname">' + esc(info.name) + '</div>';
      html += '<div>' + lang.completed + ': ' + st.completed + '</div>';
      html += '<div>' + lang.best + ': ' + (st.bestMs ? formatMs(st.bestMs) : lang.none) + '</div>';
      html += '<div>' + lang.mistakes + ': ' + st.mistakes + '</div>';
      html += '<div>' + lang.hints + ': ' + st.hints + '</div>';
      html += '</div>';
    }
    html += '<button type="button" id="switch">' + lang.changePlayer + '</button>';
    html += '<button type="button" id="back">' + lang.back + '</button>';
    setApp(html);
    byId('switch').onclick = function () { purpose = 'stats'; showPlayers(); };
    byId('back').onclick = showHome;
  }

  function eat(e) {
    if (e.preventDefault) e.preventDefault();
  }

  function onKey(e) {
    var ch, code;
    if (view !== 'game') return;
    ch = e.key || '';
    if (ch.length === 1 && ch >= '1' && ch <= '9') {
      eat(e);
      placeDigit(parseInt(ch, 10));
      return;
    }
    if (ch === 'Backspace' || ch === 'Delete') { eat(e); erase(); return; }
    if (ch === 'ArrowLeft') { eat(e); moveSel(0, -1); return; }
    if (ch === 'ArrowRight') { eat(e); moveSel(0, 1); return; }
    if (ch === 'ArrowUp') { eat(e); moveSel(-1, 0); return; }
    if (ch === 'ArrowDown') { eat(e); moveSel(1, 0); return; }
    if ((ch === 'z' || ch === 'Z') && (e.ctrlKey || e.metaKey)) { eat(e); undo(); return; }
    code = e.keyCode || e.which || 0;
    if (!ch) {
      if (code >= 49 && code <= 57) { eat(e); placeDigit(code - 48); return; }
      if (code >= 97 && code <= 105) { eat(e); placeDigit(code - 96); return; }
      if (code === 8 || code === 46) { eat(e); erase(); return; }
      if (code === 37) { eat(e); moveSel(0, -1); return; }
      if (code === 39) { eat(e); moveSel(0, 1); return; }
      if (code === 38) { eat(e); moveSel(-1, 0); return; }
      if (code === 40) { eat(e); moveSel(1, 0); return; }
    }
  }

  function moveSel(dr, dc) {
    var g = cur();
    var i, r, c;
    if (!g) return;
    i = g.selected < 0 ? 0 : g.selected;
    r = (i / 9) | 0;
    c = i % 9;
    if (g.selected < 0 && (dr || dc)) {
      select(0);
      return;
    }
    r += dr;
    c += dc;
    if (r < 0) r = 0;
    if (r > 8) r = 8;
    if (c < 0) c = 0;
    if (c > 8) c = 8;
    select(r * 9 + c);
  }

  function prepareOffline() {
    if (offlineBound) return;
    offlineBound = true;
    if (!navigator.serviceWorker) return;
    if (location.protocol !== 'http:' && location.protocol !== 'https:') return;
    try {
      navigator.serviceWorker.addEventListener('controllerchange', function () {
        var node = byId('offline');
        if (node) node.textContent = offlineText();
      });
    } catch (e4) {}
    navigator.serviceWorker.register('sw.js')['catch'](function () {});
  }

  function main() {
    load();
    document.onkeydown = onKey;
    prepareOffline();
    if (!state.lang) showLang();
    else showHome();
  }

  main();
})();

</script>
