<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Sudoku</title>
<style>
  html, body { margin: 0; padding: 0; background: #fff; color: #000; }
  body { padding: 8px; font-family: sans-serif; }
  body.play { padding: 4px; }
  h1 { font-size: 26px; font-weight: bold; text-align: center; margin: 4px 0; }
  p { margin: 4px 0; }
  p.offline { font-weight: bold; font-size: 16px; text-align: center; margin: 2px 0 8px; }
  button, input.name {
    -webkit-appearance: none;
    appearance: none;
    display: block;
    width: 100%;
    min-height: 44px;
    margin: 8px 0;
    padding: 8px;
    font-size: 18px;
    font-family: sans-serif;
    background: #fff;
    color: #000;
    border: 2px solid #000;
    border-radius: 0;
  }
  button.on { background: #000; color: #fff; }
  .meta { text-align: center; font-size: 16px; }
  .about { display: block; font-size: 14px; font-weight: normal; }
  .err { min-height: 1.2em; font-size: 16px; }
  .block { border: 2px solid #000; padding: 8px; margin: 8px 0; }
  .bname { font-weight: bold; font-size: 18px; margin-bottom: 4px; }
  .wrap { max-width: 900px; margin: 0 auto; }
  body.play .wrap { max-width: none; }
  table.playroot { width: 100%; border-collapse: collapse; }
  td.mid { height: 100%; vertical-align: top; }
  table.head { width: 100%; border-collapse: collapse; margin: 0 0 4px; }
  table.head td { vertical-align: middle; padding: 0; }
  td.hspacer { width: 30%; }
  td.htitle { width: 40%; text-align: center; }
  td.hcredit { width: 30%; text-align: right; font-size: 14px; white-space: nowrap; }
  table.head h1 { text-align: center; font-size: 22px; margin: 0; }
  table.stage { width: 100%; border-collapse: collapse; }
  td.toolwrap { width: 120px; vertical-align: top; padding: 0 8px 0 0; }
  td.boardwrap { vertical-align: top; padding: 0; }
  table.board {
    width: 100%;
    margin: 0;
    border-collapse: collapse;
    table-layout: fixed;
    background: #fff;
  }
  table.board td.c {
    border: 1px solid #000;
    text-align: center;
    vertical-align: middle;
    padding: 0;
    font-weight: normal;
    background: #fff;
    color: #000;
  }
  table.board td.bl { border-left-width: 3px; }
  table.board td.br { border-right-width: 3px; }
  table.board td.bt { border-top-width: 3px; }
  table.board td.bb { border-bottom-width: 3px; }
  table.board td.given { font-weight: bold; }
  table.board td.sel { outline: 3px solid #000; }
  table.board td.bad { background: #000; color: #fff; }
  table.n { width: 100%; height: 100%; border-collapse: collapse; table-layout: fixed; }
  table.board table.n td {
    border: 0;
    outline: none;
    background: transparent;
    color: inherit;
    font-weight: normal;
    font-size: 8px;
    line-height: 1.1;
    padding: 0;
    height: auto;
  }
  table.tools { width: 120px; margin: 0; border-collapse: separate; border-spacing: 0; }
  table.tools td { padding: 0; }
  table.tools button {
    -webkit-box-sizing: border-box;
    box-sizing: border-box;
    margin: 4px 0 0;
    min-height: 0;
    height: 32px;
    padding: 0 4px;
    font-size: 13px;
    line-height: 28px;
    text-align: center;
  }
  #menu { margin-top: 0; }
  .sideinfo { margin: 0; }
  .infobox {
    -webkit-box-sizing: border-box;
    box-sizing: border-box;
    border: 2px solid #000;
    margin: 8px 0 0;
    padding: 5px 4px;
    text-align: center;
    background: #fff;
  }
  .infobox .who { margin: 0; font-size: 14px; font-weight: bold; line-height: 1.25; word-wrap: break-word; }
  .infobox .lvl { margin: 2px 0 0; font-size: 12px; line-height: 1.25; word-wrap: break-word; }
  .infobox .stat { margin: 0; padding: 1px 0; font-size: 13px; line-height: 1.35; }
  table.digits { width: 100%; border-collapse: separate; border-spacing: 4px 0; margin: 0; }
  table.digits td { width: 11%; padding: 0; }
  table.digits button {
    -webkit-box-sizing: border-box;
    box-sizing: border-box;
    margin: 0;
    min-height: 0;
    padding: 0;
    font-size: 20px;
  }
  .hintbox { border: 0 solid #000; padding: 2px 4px; margin: 4px 0 0; font-size: 15px; }
  .egg { position: absolute; left: 0; top: 0; width: 100%; background: #fff; }
  .eggbox { border: 2px solid #000; margin: 72px auto 0; padding: 16px; width: 260px; text-align: center; background: #fff; }
  .eggbox p { font-size: 20px; font-weight: bold; margin: 0 0 12px; }
  .eggbox button { margin: 0; }
  #flash { display: none; background: #fff; height: 2400px; }
</style>
</head>
<body>
<div id="flash"></div>
<div id="app" class="wrap"></div>
<script>
__CODE__
</script>
</body>
</html>
